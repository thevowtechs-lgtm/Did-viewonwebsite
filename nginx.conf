# did:viewonwebsite — Nginx Production Configuration
# Place in /etc/nginx/sites-available/viewonwebsite.com
# Symlink: ln -s /etc/nginx/sites-available/viewonwebsite.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name viewonwebsite.com www.viewonwebsite.com;
    return 301 https://viewonwebsite.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.viewonwebsite.com;
    return 301 https://viewonwebsite.com$request_uri;

    ssl_certificate /etc/letsencrypt/live/viewonwebsite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viewonwebsite.com/privkey.pem;
}

server {
    listen 443 ssl http2;
    server_name viewonwebsite.com;

    # SSL (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/viewonwebsite.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viewonwebsite.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/viewonwebsite.com;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CORS for DID documents
    location /.well-known/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Content-Type "application/did+json";
        try_files $uri $uri/ =404;
    }

    # DID resolver endpoint
    location /resolve {
        add_header Access-Control-Allow-Origin "*";
        add_header Content-Type "application/did+json";
        try_files $uri $uri/ /resolve/index.html;
    }

    # Specification
    location /spec {
        try_files $uri $uri/ /spec/index.html;
    }

    # HTML — no cache
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # JSON — short cache
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Main
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files except .well-known
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/viewonwebsite.com.access.log;
    error_log /var/log/nginx/viewonwebsite.com.error.log;
}
